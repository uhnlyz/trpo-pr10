name: Проверка PHP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Настроить PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Проверить синтаксис
        run: find public src views -name '*.php' -print0 | xargs -0 -n1 php -l
